name: Embody Mode firmware

# The published firmware: built from sdkconfig.defaults + sdkconfig.defaults.release (no
# server or token inside; a robot is set up over USB at chan.w42.eu/setup or with
# stackchan-usb). A tag embody-v* makes a release with the parts, a manifest for browser
# flashing, and one merged image for esptool.
on:
  push:
    tags: ["embody-v*"]
    branches: ["ci/**"]    # test builds: artifacts only, never a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: docker.io/espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Dependencies
        run: python3 fetch_repos.py

      - name: Build (release.sh, the same as ./container.sh release)
        run: |
          . "$IDF_PATH/export.sh"
          version="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::8}"
          ./release.sh "$version"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: embody-firmware
          path: firmware/build-release/dist/

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: firmware/build-release/dist/*
          body: |
            Embody Mode firmware for M5Stack Stackchan (CoreS3), with no server or token inside.
            Set a robot up in Chrome at https://chan.w42.eu/setup (USB), or flash
            stackchan-embody.bin at 0x0 with esptool and set it up with stackchan-usb.
