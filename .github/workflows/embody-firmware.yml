name: Embody Mode firmware

# The published firmware: built from sdkconfig.defaults + sdkconfig.defaults.release (no
# server or token inside; a robot is set up over USB at chan.w42.eu/setup or with
# stackchan-usb). A tag embody-v* makes a release with the parts, a manifest for browser
# flashing, and one merged image for esptool.
on:
  push:
    tags: ["embody-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: docker.io/espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: python3 fetch_repos.py

      - name: Build the release image
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-release -D STACKCHAN_RELEASE=1 -D SDKCONFIG=build-release/sdkconfig \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.release" build
          cd build-release
          python -m esptool --chip esp32s3 merge_bin -o stackchan-embody.bin @flash_args

      - name: Parts and manifest
        run: |
          version="${GITHUB_REF_NAME#embody-}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::8}"
          mkdir -p dist
          cd build-release
          parts=""
          while read -r offset file; do
            name="$(basename "$file")"
            cp "$file" "../dist/$name"
            parts="$parts{\"path\":\"$name\",\"offset\":$((offset)),\"sha256\":\"$(sha256sum "$file" | cut -d' ' -f1)\"},"
          done < <(tail -n +2 flash_args)
          cp stackchan-embody.bin ../dist/
          printf '{"name":"Stackchan Embody Mode","version":"%s","chipFamily":"ESP32-S3","parts":[%s]}\n' \
            "$version" "${parts%,}" > ../dist/manifest.json
          cd ../dist && sha256sum * > SHA256SUMS && cat manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: embody-firmware
          path: firmware/dist/

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/dist/*
          body: |
            Embody Mode firmware for M5Stack Stackchan (CoreS3), with no server or token inside.
            Set a robot up in Chrome at https://chan.w42.eu/setup (USB), or flash
            stackchan-embody.bin at 0x0 with esptool and set it up with stackchan-usb.
